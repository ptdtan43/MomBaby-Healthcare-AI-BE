version: '3.8'

services:
  momoi-api:        # ASP.NET Core 8 backend
    build:
      context: .
      dockerfile: MomOi.API/Dockerfile
    ports:
      - "8000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=pgdb;Port=5432;Database=momoidb;Username=postgres;Password=${POSTGRES_PASSWORD};
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UsdaApiKey=${USDA_API_KEY}
      - NutritionApiUrl=http://nutrition-api:8001
      - RunMigrationsOnStartup=true
      # Khoá ký JWT. Thiếu hai biến này, app sẽ tự sinh khoá RSA trong RAM
      # => mỗi lần khởi động lại là toàn bộ người dùng bị đăng xuất.
      - Jwt__PrivateKey=${JWT_PRIVATE_KEY}
      - Jwt__PublicKey=${JWT_PUBLIC_KEY}
      # Mật khẩu tài khoản nền. KHÔNG đặt thì DbInitializer bỏ qua việc tạo
      # tài khoản, thay vì dùng mật khẩu mặc định (xem Data/DbInitializer.cs).
      - Seed__AdminPassword=${SEED_ADMIN_PASSWORD}
      - EnableSwagger=true
    depends_on:
      - pgdb

  nutrition-api:    # Python FastAPI (USDA engine)
    build:
      context: ./MomOi.NutritionAPI
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - USDA_API_KEY=${USDA_API_KEY}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@pgdb:5432/momoidb
    depends_on:
      - pgdb

  pgdb:             # PostgreSQL database (dùng chung cho cả C# API và Python API)
    image: postgres:15-alpine
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Tên database phải KHỚP CHÍNH XÁC với Database= trong chuỗi kết nối ở trên.
      # PostgreSQL phân biệt hoa thường với tên được tạo trong dấu nháy kép,
      # nên MomOiDb và momoidb là HAI database khác nhau.
      - POSTGRES_DB=momoidb
    volumes:
      - pgdb_data:/var/lib/postgresql/data


volumes:
  pgdb_data:
